name: ClickUp Status Sync
description: Map GitHub branch, PR and release events to ClickUp task statuses (no native ClickUp automations).

inputs:
  clickup-token:
    description: ClickUp API token (pk_...) of the bot user.
    required: true
  github-token:
    description: Token that lists a prod-branch PR's commits, the releases and a release's commits (needs contents read).
    required: false
    default: ${{ github.token }}
  clickup-team-id:
    description: ClickUp workspace/team id (for custom_task_ids).
    required: false
    default: "90151502952"
  dev-branch:
    description: Branch that maps to in review / dev done.
    required: false
    default: develop
  prod-branch:
    description: Branch that maps to demo done / shipped.
    required: false
    default: main
  id-prefix:
    description: Custom task id prefix.
    required: false
    default: CORE
  status-in-dev:
    description: ClickUp status when a branch is created.
    required: false
    default: in development
  status-in-review:
    description: ClickUp status when a PR is opened to the dev branch.
    required: false
    default: in review
  status-dev-done:
    description: ClickUp status when a PR is merged to the dev branch.
    required: false
    default: dev done
  status-demo-done:
    description: ClickUp status when a PR is opened, updated or merged to the prod branch.
    required: false
    default: demo done
  status-shipped:
    description: ClickUp status when a release is published.
    required: false
    default: shipped
  release-ids-from:
    description: >-
      Where a published release's task ids are read from. `commits` (the commits
      since the previous published release with the same tag prefix) or `body`
      (the release notes, when they already list only what the release ships).
    required: false
    default: commits

runs:
  using: composite
  steps:
    - name: Sync ClickUp status
      shell: bash
      env:
        CLICKUP_TOKEN: ${{ inputs.clickup-token }}
        CLICKUP_TEAM_ID: ${{ inputs.clickup-team-id }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_API_URL: ${{ github.api_url }}
        REPO: ${{ github.repository }}
        DEV_BRANCH: ${{ inputs.dev-branch }}
        PROD_BRANCH: ${{ inputs.prod-branch }}
        ID_PREFIX: ${{ inputs.id-prefix }}
        STATUS_IN_DEV: ${{ inputs.status-in-dev }}
        STATUS_IN_REVIEW: ${{ inputs.status-in-review }}
        STATUS_DEV_DONE: ${{ inputs.status-dev-done }}
        STATUS_DEMO_DONE: ${{ inputs.status-demo-done }}
        STATUS_SHIPPED: ${{ inputs.status-shipped }}
        RELEASE_IDS_FROM: ${{ inputs.release-ids-from }}
        EVENT_NAME: ${{ github.event_name }}
        REF_TYPE: ${{ github.event.ref_type }}
        CREATED_REF: ${{ github.event.ref }}
        PR_ACTION: ${{ github.event.action }}
        PR_MERGED: ${{ github.event.pull_request.merged }}
        PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
        PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        PR_BODY: ${{ github.event.pull_request.body }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
        RELEASE_BODY: ${{ github.event.release.body }}
        RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
      run: ${{ github.action_path }}/sync.sh
